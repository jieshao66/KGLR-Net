[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kglr-net"
version = "0.1.0"
description = "Knowledge-guided global-to-local refinement for limited-annotation medical image segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Xijie Wang", email = "202511160296@nwnu.edu.cn"},
  {name = "Yun Jiang", email = "jiangyun@nwnu.edu.cn"},
  {name = "Tao Sun", email = "202421162201@nwnu.edu.cn"},
]
keywords = [
  "medical image segmentation",
  "limited annotations",
  "Segment Anything",
  "global-to-local refinement",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools.packages.find]
include = ["kglr_net*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"kglr_net/models.py" = ["E"]

[tool.pytest.ini_options]
testpaths = ["tests"]
